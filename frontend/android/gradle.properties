# 2 GB alcanzan para compilar la app. El valor de la plantilla (8 GB) es más que toda la RAM de un portátil
# de 4 GB: el sistema se queda sin memoria y cierra procesos a mitad de la compilación.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
