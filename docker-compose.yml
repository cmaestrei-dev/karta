# Entorno de desarrollo: PostgreSQL + PostGIS y la API de Karta.
# Uso: docker compose up --build   →   Swagger en http://localhost:8000/api/v1/docs
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: karta
      POSTGRES_PASSWORD: karta
      POSTGRES_DB: karta_db
    ports:
      - "5433:5432" # 5433 en el host para no chocar con un PostgreSQL local
    volumes:
      - karta_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Por TCP: durante la inicialización el servidor temporal solo escucha por socket.
      test: ["CMD-SHELL", "pg_isready -h localhost -U karta -d karta_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://karta:karta@db:5432/karta_db
      CORS_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src # recarga en caliente al editar el código
    command: >
      sh -c "python -m src.infrastructure.init_db &&
             python -m src.infrastructure.seed &&
             uvicorn src.infrastructure.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  karta_pgdata:
